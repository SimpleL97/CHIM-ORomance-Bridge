# CHIM ORomance Bridge - builds the mod on GitHub and attaches it to releases.
#
# Every push and pull request: the whole mod is built from source (tools/build_linux.sh:
# plugin, Papyrus scripts, CHIM server package, FOMOD archive) and the archive is kept as
# the run's artifact "CHIM ORomance Bridge" - download it from the run to test a build.
#
# Publishing a GitHub release from a tag (v1.0.0): the tagged commit is built the same
# way, its version must match the tag, the archive is attached to the release and - once
# MOD_ID / FILE_ID below are set - uploaded to Nexus Mods as a new version of the main file
# (the previous one moves to "Old versions", the release text becomes the changelog).
# Actions -> Run workflow with a tag publishes an existing release again.
# (Uploading to Nexus Mods is added once the mod's first file is on Nexus: the upload
# adds versions to an existing file and needs its file ID.)
#
# The Papyrus compiler is the open-source papyrus-compiler (MIT), built here from source
# at a pinned commit with the V version its own release workflow uses; it type-checks
# against the declaration-only headers in stubs/, so no game files are needed.

name: Build and release

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish an existing release again, e.g. v1.0.0 (empty: only build)"
        required: false

permissions:
  contents: read

env:
  # Nexus Mods: fill in once the mod page exists and its first main file is uploaded by hand.
  # Both ids are in that file's "Advanced" dialog on the Files tab, section API: "Unique Mod ID"
  # and "File ID" - not the numbers in the page address or the download link. Until then a
  # release is only attached on GitHub. Secret NEXUSMODS_API_KEY (environment "Nexus" or the
  # repository's secrets): personal API key from nexusmods.com/settings/api-keys.
  # The page: nexusmods.com/skyrimspecialedition/mods/198436
  MOD_ID: "7318624470820"   # "Unique Mod ID" (the changelog goes to /mods/<id>/changelogs)
  FILE_ID: "8340303"        # "File ID" of the main file "CHIM ORomance Bridge"; new versions are added to it
  # versions already uploaded to Nexus by hand: their GitHub release is not uploaded again
  NEXUS_UPLOADED_BY_HAND: "1.0.0"
  ARCHIVE: "dist/CHIM ORomance Bridge.zip"
  # papyrus-compiler master with the string escape fix (issue 19), after release 0.0.4
  PAPYRUS_COMPILER_COMMIT: b9dc9951f4264084c8ded6721b20f0d81c021d58
  V_VERSION: "0.5.1"
  V_SHA256: 0c35c79343b308e0415619d8e6d8da340c6a24c18331123553cc686ffb18abf4

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Which tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag || github.ref }}

      - name: Papyrus compiler from cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/papyrus-compiler
          key: papyrus-compiler-${{ env.PAPYRUS_COMPILER_COMMIT }}-v${{ env.V_VERSION }}

      - name: Build the Papyrus compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o v.zip "https://github.com/vlang/v/releases/download/$V_VERSION/v_linux.zip"
          echo "$V_SHA256  v.zip" | sha256sum -c -
          unzip -q v.zip
          git clone --quiet https://github.com/russo-2025/papyrus-compiler.git pc
          git -C pc checkout --quiet "$PAPYRUS_COMPILER_COMMIT"
          (cd pc && ../v/v -prod -gc none -o bin/papyrus-compiler compiler.v)
          mkdir -p ~/papyrus-compiler
          cp pc/bin/papyrus-compiler ~/papyrus-compiler/

      - name: Build the mod
        run: |
          ~/papyrus-compiler/papyrus-compiler version
          bash tools/build_linux.sh ~/papyrus-compiler/papyrus-compiler dist

      - name: Version matches the tag
        if: steps.tag.outputs.tag != ''
        run: |
          FOUND=$(unzip -p "$ARCHIVE" fomod/info.xml | grep -o 'MachineVersion="[^"]*"' | cut -d'"' -f2)
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "$FOUND" != "${TAG#v}" ]; then
            echo "::error::the mod is version $FOUND, the tag is $TAG"; exit 1
          fi
          echo "version $FOUND OK"

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: CHIM ORomance Bridge
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: Nexus
    permissions:
      contents: write  # attach the archive to the release
    steps:
      - name: Get the archive
        uses: actions/download-artifact@v4
        with:
          name: CHIM ORomance Bridge
          path: dist

      - name: Attach the archive to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.build.outputs.tag }}" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Is there a Nexus page yet
        id: nexus
        run: |
          V="${{ needs.build.outputs.tag }}"; V="${V#v}"
          if printf ' %s ' $NEXUS_UPLOADED_BY_HAND | grep -q " $V "; then
            echo "::notice::$V was uploaded to Nexus Mods by hand - not uploaded again; the GitHub release has the archive"
          elif [ -n "$MOD_ID" ] && [ -n "$FILE_ID" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::MOD_ID and FILE_ID are not set in this workflow yet - not uploaded to Nexus Mods; the GitHub release has the archive"
          fi

      - name: Release notes as the Nexus changelog
        id: notes
        if: steps.nexus.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(gh release view "${{ needs.build.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          # plain lines for Nexus: no markdown headings, bold or links
          CLEAN=$(printf '%s\n' "$BODY" | sed -E 's/^#+ *//; s/\*\*//g; s/\[([^]]*)\]\([^)]*\)/\1/g')
          {
            echo "changelog<<CHANGELOG_EOF"
            printf '%s\n' "$CLEAN"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Version for Nexus
        id: version
        if: steps.nexus.outputs.go == 'true'
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        if: steps.nexus.outputs.go == 'true'
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.MOD_ID }}
          file_id: ${{ env.FILE_ID }}
          filename: ${{ env.ARCHIVE }}
          version: ${{ steps.version.outputs.version }}
          display_name: CHIM ORomance Bridge
          description: "FOMOD installer; the CHIM server plugin installs and updates itself at game start. Source and build instructions: https://github.com/SimpleL97/CHIM-ORomance-Bridge"
          category: main
          archive_existing_version: true
          update_mod_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          changelog: ${{ steps.notes.outputs.changelog }}
